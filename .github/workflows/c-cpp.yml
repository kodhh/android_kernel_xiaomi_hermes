name: Build Kernel

on:
  push:
    branches: [ bpf ]
  pull_request:
    branches: [ bpf ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GCC_PATH: /prebuilt/gcc
      GCC32_PATH: /prebuilt/gcc32

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
        sudo bash -c "mkdir /{build,prebuilt} && chown $(whoami):$(whoami) /{build,prebuilt}"
        git clone --depth=1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git $GCC_PATH
        git clone --depth=1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git $GCC32_PATH

    - name: Configure Kernel
      run: |
        export PATH="$GCC_PATH/bin:$GCC32_PATH/bin:$PATH"
        make O=out ARCH=arm64 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- cc-name=gcc MTK_PLATFORM="mt6795" hermes_defconfig

    - name: Build Kernel
      run: |
        export PATH="$GCC_PATH/bin:$GCC32_PATH/bin:$PATH"
        make O=out ARCH=arm64 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- cc-name=gcc MTK_PLATFORM="mt6795" -j$(nproc)

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: out/arch/arm64/boot/Image.gz

    - name: Upload DTBs
      uses: actions/upload-artifact@v4
      with:
        name: dtbs
        path: out/arch/arm64/boot/dts/hermes.dtb
