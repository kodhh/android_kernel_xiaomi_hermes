name: Build Kernel

on:
  push:
    branches: [ lineage-16.0 ]
  pull_request:
    branches: [ lineage-16.0 ]

jobs:
  build:
    # 根据项目需求选择 windows-latest 或 ubuntu-latest
    runs-on: ubuntu-22.04  # 若在Windows上编译，通常需改为 windows-latest
    env:
      GCC_PATH: /prebuilt/gcc
      GCC32_PATH: /prebuilt/gcc32

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Clang and Dependencies
      run: |
        # 在Ubuntu上安装Clang及编译依赖（示例命令，具体包名请根据你的WSL2内核需求调整）
        sudo apt-get update
        sudo apt-get install -y git gcc automake autoconf libtool make flex lzop bison gperf build-essential zip curl zlib1g-dev libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip
        sudo bash -c "mkdir /{build,prebuilt} && chown $(whoami):$(whoami) /{build,prebuilt}"
        git clone --depth=1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git $GCC_PATH
        git clone --depth=1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git $GCC32_PATH

    - name: Configure Kernel
      run: |
        export PATH="$GCC_PATH/bin:$GCC32_PATH/bin:$PATH"
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- cc-name=gcc MTK_PLATFORM="mt6795" hermes_defconfig

    - name: Build Kernel
      run: |
        export PATH="$GCC_PATH/bin:$GCC32_PATH/bin:$PATH"
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- cc-name=gcc MTK_PLATFORM="mt6795" -j$(nproc)

    # 可选：上传构建产物
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: arch/arm64/boot/Image.gz

    - name: Upload Build Artifacts1
      uses: actions/upload-artifact@v4
      with:
        name: dtbs
        path: arch/arm64/boot/dts/hermes.dtb
